<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Building Surveys | City Wide Nevada</title>
<link rel="icon" href="https://citywidelv.github.io/cw-ops-desk/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="https://citywidelv.github.io/cw-ops-desk/apple-touch-icon.png">
<style>
:root {
  --cw-red: #D22730; --cw-red-dark: #B01F27; --cw-red-light: #f5d0d2;
  --cw-black: #2d2a26; --cw-grey: #636466; --cw-grey-light: #e8e8e9; --cw-grey-lighter: #f5f5f6;
  --cw-teal: #0AA6A9; --cw-teal-dark: #088c8e; --cw-gold: #E5B423; --cw-white: #ffffff;
  --shadow-sm: 0 1px 3px rgba(45,42,38,0.08); --radius-sm: 6px; --radius-md: 10px;
  --font-stack: Verdana, Geneva, Tahoma, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body { font-family: var(--font-stack); color: var(--cw-black); background: var(--cw-grey-lighter); min-height: 100dvh; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.app-header { background: var(--cw-white); border-bottom: 3px solid var(--cw-red); padding: 12px 16px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }
.header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-img { height: 32px; width: auto; }
.logo-label { font-size: 11px; font-weight: bold; color: var(--cw-grey); text-transform: uppercase; letter-spacing: 1px; border-left: 3px solid var(--cw-gold); padding-left: 10px; }
a.back { font-size: 12px; font-weight: bold; color: var(--cw-grey); text-decoration: none; border: 1px solid var(--cw-grey-light); border-radius: 14px; padding: 8px 14px; min-height: 40px; display: inline-flex; align-items: center; white-space: nowrap; }
main { max-width: 900px; margin: 0 auto; padding: 16px 16px 60px; }
h1 { font-size: 22px; margin-bottom: 4px; }
.sub { font-size: 13px; color: var(--cw-grey); margin-bottom: 16px; }
.cta { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
.btn-new { display: flex; align-items: center; justify-content: center; min-height: 56px; background: var(--cw-red); color: white; font-weight: bold; font-size: 16px; border-radius: var(--radius-md); text-decoration: none; box-shadow: var(--shadow-sm); }
.btn-new:active { background: var(--cw-red-dark); }
.tools { display: flex; gap: 8px; margin-bottom: 14px; }
.tools input { flex: 1; padding: 12px 14px; font-size: 16px; border: 1.5px solid var(--cw-grey-light); border-radius: var(--radius-sm); font-family: var(--font-stack); -webkit-appearance: none; background: var(--cw-white); }
.tools button { min-width: 48px; min-height: 48px; border: 1.5px solid var(--cw-grey-light); border-radius: var(--radius-sm); background: var(--cw-white); font-size: 18px; cursor: pointer; }
.status { font-size: 12px; color: var(--cw-grey); margin-bottom: 10px; min-height: 16px; }
.status.err { color: var(--cw-red); font-weight: bold; }
.group { margin-bottom: 18px; }
.group-head { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 2px; border-bottom: 2px solid var(--cw-red); margin-bottom: 8px; }
.group-head h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--cw-red); }
.group-head span { font-size: 11px; color: var(--cw-grey); }
.group-head.other h2 { color: var(--cw-black); }
.group-head.other { border-bottom-color: var(--cw-grey-light); }
.card { background: var(--cw-white); border: 1px solid rgba(99,100,102,0.1); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.card .co { font-size: 16px; font-weight: bold; color: var(--cw-black); }
.card .addr { font-size: 12px; color: var(--cw-grey); }
.card .meta { font-size: 12px; color: var(--cw-grey); margin-top: 2px; }
.card .meta b { color: var(--cw-black); }
.card .hot { color: var(--cw-red); font-weight: bold; }
.card .acts { display: flex; flex-direction: column; gap: 6px; }
.card a.act { display: flex; align-items: center; justify-content: center; min-width: 96px; min-height: 42px; padding: 0 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: bold; text-decoration: none; }
.card a.open { background: var(--cw-teal); color: white; }
.card a.open:active { background: var(--cw-teal-dark); }
.card a.xlsx { background: var(--cw-white); color: var(--cw-teal-dark); border: 1.5px solid var(--cw-teal); }
.empty { text-align: center; color: var(--cw-grey); padding: 30px 12px; font-size: 14px; }
.skel { height: 68px; border-radius: var(--radius-md); background: linear-gradient(90deg, #ededee 25%, #f7f7f7 50%, #ededee 75%); background-size: 200% 100%; animation: sh 1.2s infinite; margin-bottom: 8px; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (min-width: 640px) { .cta { grid-template-columns: 1fr 1fr; } main { padding-top: 24px; } .card { padding: 14px 18px; } .card .acts { flex-direction: row; } }
</style>
<link rel="stylesheet" href="https://citywidelv.github.io/cw-base.css">
<script src="https://citywidelv.github.io/cw-ops-desk/cw-auth.js"></script>
<script>/* Sub page of the Sales Hub: no passcode box here, bounce to the hub gate if the device has no unlock. */
(function(){ if(!window.CWAuth) return;
  var p = CWAuth.require({hub:"sales"}); if(!p){ document.documentElement.style.visibility="hidden"; return; }
  window.addEventListener("load", function(){ CWAuth.validate(p,"auth").then(function(r){ if(r.ok===false) CWAuth.locked("sales","Wrong passcode."); }); }); })();
</script>
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="logo-area">
      <img class="logo-img" src="https://emailer.emfluence.com/clients/citywide/uploadedfiles/signature_logo.png" alt="City Wide Facility Solutions">
      <span class="logo-label">Building Surveys</span>
    </div>
    <a class="back" href="https://citywidelv.github.io/sales-hub/">&larr; Sales Hub</a>
  </div>
</header>

<main>
  <h1>Past surveys</h1>
  <p class="sub">Every survey saved to the cloud, by the person who walked it. Open one to review or change it, or send it straight to Excel.</p>

  <div class="cta">
    <a class="btn-new" href="./?new=1">&#43; Start a new survey</a>
  </div>

  <div class="tools">
    <input type="search" id="q" placeholder="Search company, address or name" autocomplete="off">
    <button type="button" id="refresh" title="Refresh">&#8635;</button>
  </div>
  <div class="status" id="status"></div>
  <div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<script>
(function () {
  'use strict';
  var CACHE_KEY = 'cw_survey_list_cache';
  var STAFF_KEY = 'cw_staff_cache';
  var surveys = [], staff = [];
  var listEl = document.getElementById('list'), statusEl = document.getElementById('status'), qEl = document.getElementById('q');

  function api(kind, data) {
    var url = (window.CWAuth && CWAuth.WEBHOOK) || '';
    var pass = (window.CWAuth && CWAuth.get && CWAuth.get()) || '';
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ kind: kind, passcode: pass }, data || {})) })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (!r || r.ok !== true) throw new Error((r && r.error) || 'Cloud error'); return r; });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function readCache(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function writeCache(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function isSales(name) {
    var s = staff.find(function (x) { return x.name === name; });
    return !!(s && /sales/i.test(s.role || ''));
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    var d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(iso);
    if (isNaN(d)) return String(iso).slice(0, 10);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  }
  function rel(iso) {
    var d = new Date(iso); if (isNaN(d)) return '';
    var m = Math.round((Date.now() - d.getTime()) / 60000);
    if (m < 2) return 'just now'; if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60); if (h < 24) return h + ' hr ago';
    var dd = Math.round(h / 24); if (dd < 7) return dd + ' day' + (dd > 1 ? 's' : '') + ' ago';
    return fmtDate(iso);
  }

  function render() {
    var q = (qEl.value || '').trim().toLowerCase();
    var rows = surveys.filter(function (s) {
      if (!q) return true;
      return [s.company, s.address, s.surveyor, s.industry].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    if (!rows.length) {
      listEl.innerHTML = '<div class="empty">' + (surveys.length ? 'No survey matches that.' : 'No surveys saved to the cloud yet. Walk one and it shows up here.') + '</div>';
      return;
    }
    // Group by surveyor. Sales first alphabetically, then everyone else, then unassigned.
    var groups = {};
    rows.forEach(function (s) { var k = s.surveyor || ''; (groups[k] = groups[k] || []).push(s); });
    var names = Object.keys(groups).filter(Boolean);
    var sales = names.filter(isSales).sort(), others = names.filter(function (n) { return !isSales(n); }).sort();
    var order = sales.concat(others); if (groups['']) order.push('');
    var html = '';
    order.forEach(function (name) {
      var list = groups[name].slice().sort(function (a, b) { return String(b.updated_at).localeCompare(String(a.updated_at)); });
      var cls = isSales(name) ? '' : ' other';
      html += '<div class="group"><div class="group-head' + cls + '"><h2>' + (name ? esc(name) : 'No name picked') + '</h2><span>' + list.length + ' survey' + (list.length === 1 ? '' : 's') + '</span></div>';
      list.forEach(function (s) {
        var meta = [];
        meta.push('<b>' + fmtDate(s.survey_date || s.updated_at) + '</b>');
        if (Number(s.areas)) meta.push(s.areas + ' areas');
        if (Number(s.sqft)) meta.push(Number(s.sqft).toLocaleString() + ' sf');
        if (Number(s.trash)) meta.push(s.trash + ' trash');
        if (Number(s.walk_min)) meta.push(s.walk_min + ' walk min');
        if (Number(s.hot_spots)) meta.push('<span class="hot">' + s.hot_spots + ' hot</span>');
        if (Number(s.photos)) meta.push('📷 ' + s.photos);
        meta.push('edited ' + rel(s.updated_at));
        var id = encodeURIComponent(s.id);
        html += '<div class="card"><div>' +
          '<div class="co">' + esc(s.company || 'Untitled Survey') + '</div>' +
          (s.address ? '<div class="addr">' + esc(s.address) + (s.industry ? ' · ' + esc(s.industry) : '') + '</div>' : (s.industry ? '<div class="addr">' + esc(s.industry) + '</div>' : '')) +
          '<div class="meta">' + meta.join(' · ') + '</div></div>' +
          '<div class="acts"><a class="act open" href="./?open=' + id + '">Open</a><a class="act xlsx" href="./?open=' + id + '&export=1">Export to Excel</a></div></div>';
      });
      html += '</div>';
    });
    listEl.innerHTML = html;
  }

  function load(force) {
    var c = readCache(CACHE_KEY);
    var sc = readCache(STAFF_KEY);
    if (sc && sc.staff) staff = sc.staff;
    if (c && c.surveys && !force) { surveys = c.surveys; render(); statusEl.textContent = 'Showing the last list. Refreshing...'; }
    var staffP = (sc && sc.staff && Date.now() - (sc.ts || 0) < 12 * 3600 * 1000) ? Promise.resolve(sc.staff)
      : api('staff_list').then(function (r) { staff = r.staff || []; writeCache(STAFF_KEY, { ts: Date.now(), staff: staff }); return staff; }).catch(function () { return staff; });
    return Promise.all([api('bs_list'), staffP]).then(function (res) {
      surveys = res[0].surveys || [];
      writeCache(CACHE_KEY, { ts: Date.now(), surveys: surveys });
      statusEl.className = 'status';
      statusEl.textContent = surveys.length + ' survey' + (surveys.length === 1 ? '' : 's') + ' · updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      render();
    }).catch(function (e) {
      statusEl.className = 'status err';
      statusEl.textContent = surveys.length ? 'Could not refresh. Showing the last list.' : 'Could not reach the cloud. ' + (e && e.message ? e.message : '');
      if (!surveys.length) listEl.innerHTML = '<div class="empty">Nothing to show until the connection comes back.</div>';
      if (e && /passcode/i.test(String(e.message)) && window.CWAuth) CWAuth.locked('sales', e.message);
    });
  }

  qEl.addEventListener('input', render);
  document.getElementById('refresh').addEventListener('click', function () { statusEl.textContent = 'Refreshing...'; load(true); });
  load(false);
})();
</script>
</body>
</html>
